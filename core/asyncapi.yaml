# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Agents Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Agents server and any UI client
    (the bundled VS Code webview, the standalone browser SPA, or future third-party
    clients). The server watches AI-coding-agent transcripts, parses tool activity, 
    owns office layout, and streams events to all connected clients. 
    Clients send commands to launch agents, save layout, and toggle settings.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.
  license:
    name: MIT
  contact:
    name: Pixel Agents
    url: https://github.com/pablodelucca/pixel-agents

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Pixel Agents server (default port 3100)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/AgentSelected'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        # Task board
        - $ref: '#/components/schemas/AgentTaskFinished'
        # Cat office (orchestrator)
        - $ref: '#/components/schemas/CatProfilesLoaded'
        - $ref: '#/components/schemas/CatProfileSaved'
        - $ref: '#/components/schemas/CatProfileRejected'
        - $ref: '#/components/schemas/CatHierarchy'
        - $ref: '#/components/schemas/CatTurnStarted'
        - $ref: '#/components/schemas/CatTurnFinished'
        - $ref: '#/components/schemas/CatMessage'
        - $ref: '#/components/schemas/FlowStateChanged'
        - $ref: '#/components/schemas/QueueChanged'
        - $ref: '#/components/schemas/CatCharacters'
        # Cat CEO
        - $ref: '#/components/schemas/CatCeoSettings'
        - $ref: '#/components/schemas/ReviewStarted'
        - $ref: '#/components/schemas/ReviewFinished'
        - $ref: '#/components/schemas/ReviewFailed'
        - $ref: '#/components/schemas/PromptHistory'
        - $ref: '#/components/schemas/PromptDiff'
        - $ref: '#/components/schemas/PromptTidy'
        # Narrator
        - $ref: '#/components/schemas/NarratorLine'
        - $ref: '#/components/schemas/NarratorSummary'
        - $ref: '#/components/schemas/NarratorSettings'
        # Context window
        - $ref: '#/components/schemas/AgentContextUsage'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        - $ref: '#/components/schemas/ResetAllResult'
        # Pet care
        - $ref: '#/components/schemas/PetCareLoaded'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        - $ref: '#/components/schemas/CarpetTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/HooksStatus'
        - $ref: '#/components/schemas/HooksConsentRequest'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        - $ref: '#/components/schemas/AreaMappingsLoaded'
        - $ref: '#/components/schemas/WorkspaceFolders'
        # Diagnostics
        - $ref: '#/components/schemas/AgentDiagnostics'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/LaunchAgent'
        - $ref: '#/components/schemas/FocusAgent'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/SavePetCare'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/SetGhostHeadlessAgents'
        - $ref: '#/components/schemas/SetHooksEnabled'
        - $ref: '#/components/schemas/HooksConsentResponse'
        - $ref: '#/components/schemas/SetHooksInfoShown'
        - $ref: '#/components/schemas/SetWatchAllSessions'
        - $ref: '#/components/schemas/ExportLayout'
        - $ref: '#/components/schemas/ResetLayoutToDefault'
        - $ref: '#/components/schemas/ResetAllToDefault'
        - $ref: '#/components/schemas/ImportLayout'
        - $ref: '#/components/schemas/OpenSessionsFolder'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/SaveAreaMappings'
        - $ref: '#/components/schemas/SetShowAreas'
        - $ref: '#/components/schemas/RequestDiagnostics'
        - $ref: '#/components/schemas/SaveCatProfile'
        - $ref: '#/components/schemas/DeleteCatProfile'
        - $ref: '#/components/schemas/SetCatParent'
        - $ref: '#/components/schemas/PromoteCatToBoss'
        - $ref: '#/components/schemas/SetTurnConcurrency'
        - $ref: '#/components/schemas/SetShowGuests'
        - $ref: '#/components/schemas/SetNarratorSettings'
        - $ref: '#/components/schemas/SetCatCeoSettings'
        - $ref: '#/components/schemas/GetPromptHistory'
        - $ref: '#/components/schemas/GetPromptDiff'
        - $ref: '#/components/schemas/RevertPromptEdit'
        - $ref: '#/components/schemas/RestorePromptVersion'
        - $ref: '#/components/schemas/RemovePromptItem'
        - $ref: '#/components/schemas/SavePromptItem'
        - $ref: '#/components/schemas/TidyPrompt'
        - $ref: '#/components/schemas/CheckEngines'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Tells the client
        which tool names should render with the "reading" animation and which spawn
        sub-agent characters.
      type: object
      additionalProperties: false
      required: [type, readingTools, subagentToolNames]
      properties:
        type:
          const: providerCapabilities
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        id:
          type: integer
        folderName:
          type: string
        isExternal:
          type: boolean
        palette:
          type: integer
          description: Server-assigned character palette index.
        hueShift:
          type: integer
          description: Server-assigned hue shift in degrees (0-360).

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    AgentSelected:
      description: An agent's terminal was focused (VS Code only). UI should highlight it.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSelected
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, folderNames, externalAgents]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        folderNames:
          type: object
          description: Map of agent ID (string) to workspace folder name.
          additionalProperties:
            type: string
        externalAgents:
          type: object
          description: Map of agent ID (string) to external flag.
          additionalProperties:
            type: boolean

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").

    AgentActivityStatus:
      description: Activity state of an agent.
      type: string
      enum: [active, waiting]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean
        isTeammateSpawn:
          type: boolean
          description: >-
            True when this spawn tool call carries a name, making the spawn a
            Teammate-to-be. The office must not create a Subtask sub-character
            for it — a teammate character will represent the spawn instead.

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    SubagentToolStart:
      description: Sub-agent (e.g. Task) started a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentTaskFinished:
      description: |
        A task-board run ended (done or error). Its character stays in the office
        as an idle cat until the server restarts; clicking it opens the task.
      type: object
      additionalProperties: false
      required: [type, id, taskId]
      properties:
        type:
          const: agentTaskFinished
        id:
          type: integer
        taskId:
          type: string

    AgentContextUsage:
      description: |
        How much of the agent's context window is in use, as of its most recent
        turn. A snapshot, NOT a running total: it falls when the session
        compacts or clears. `maxContextTokens` is the runtime's best estimate of
        the window size — transcripts don't state it, so it starts at the
        default and widens (never shrinks) once a larger context is observed.
        Sent for every agent, including leads and teammates; sub-agents have no
        session of their own and never report it.
      type: object
      additionalProperties: false
      required: [type, id, contextTokens, maxContextTokens]
      properties:
        type:
          const: agentContextUsage
        id:
          type: integer
        contextTokens:
          type: integer
        maxContextTokens:
          type: integer

    ResetAllResult:
      description: |
        The answer to resetAllToDefault, sent to the requester only. `backupDir`
        is where the old files were copied (the reset is done). `error` says
        why nothing changed.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: resetAllResult
        backupDir:
          type: string
        error:
          type: string

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer.
            - type: 'null'
        wasReset:
          type: boolean

    PetCareLoaded:
      description: |
        Persisted pet-care state (needs, bowls, litter, floor poops) from
        ~/.pixel-agents/pets-state.json, sent once after webviewReady and again
        after resetAllToDefault.
        `null` when nothing is saved yet.
      type: object
      additionalProperties: false
      required: [type, state]
      properties:
        type:
          const: petCareLoaded
        state:
          oneOf:
            - type: object
              description: Opaque pet-care snapshot; format owned by the webview pet-care module.
            - type: 'null'

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterSpritesLoaded:
      description: Pre-colored character sprite sets (6 palettes), sent once at startup.
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string
        petSpecies:
          type: array
          description: Species parallel-indexed to `pets` (manifest `species`, e.g. "cat"; empty string when unset). Cats get the pet-care needs.
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: wallTilesLoaded
        sets:
          type: array
          description: Array of wall tile sets; each set is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    CarpetTilesLoaded:
      description: Carpet auto-tile sprite sets (16 marching-squares pieces per variant).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: carpetTilesLoaded
        sets:
          type: array
          description: Array of carpet variants; each variant is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    SettingsLoaded:
      description: All persisted user-level settings, sent once on connect.
      type: object
      additionalProperties: false
      required:
        - type
        - soundEnabled
        - lastSeenVersion
        - extensionVersion
        - watchAllSessions
        - alwaysShowLabels
        - ghostHeadlessAgents
        - hooksEnabled
        - hooksInfoShown
        - externalAssetDirectories
        - showAreas
      properties:
        type:
          const: settingsLoaded
        soundEnabled:
          type: boolean
        lastSeenVersion:
          type: string
        extensionVersion:
          type: string
        watchAllSessions:
          type: boolean
        alwaysShowLabels:
          type: boolean
        ghostHeadlessAgents:
          type: boolean
        hooksEnabled:
          type: boolean
        hooksInfoShown:
          type: boolean
        externalAssetDirectories:
          type: array
          items:
            type: string
        showAreas:
          type: boolean
        showGuests:
          type: boolean
          description: Standalone only. External Claude sessions show as translucent guests.
        turnConcurrency:
          type: integer
          description: Standalone only. Cap on cat turns that run at once.

    HooksStatus:
      description: |
        Actual hook installation state, as opposed to the hooksEnabled
        preference in SettingsLoaded. The two can disagree: hooksEnabled
        defaults to true while first-run consent is still pending and nothing
        is installed yet. Sent after the connect handshake and whenever the
        install state changes (consent granted, settings toggle, uninstall).
      type: object
      additionalProperties: false
      required: [type, providerId, installed]
      properties:
        type:
          const: hooksStatus
        providerId:
          type: string
          description: >-
            The hook provider this install state is about (HookProvider.id,
            e.g. "claude"). Consumers keyed on install state must never mix
            one provider's status into another's — the Intro's install
            verdict in particular reads only the provider it asked about.
        installed:
          type: boolean

    HooksConsentRequest:
      description: |
        Ask this client to run the first-run hooks consent dialog. Sent during the
        `webviewReady` handshake when the hooks preference is on, consent has not
        been recorded, and nothing of ours is installed — and, in standalone, only
        on privileged (tokened) connections, since an untokened spectator could not
        act on it anyway (its `hooksConsentResponse` would be ignored).

        Carries the provider being asked about and its disclosure copy so the
        client renders the server's exact terms (the provider's
        consentDisclosure(), shared with no client-side duplicate to drift).
        The client answers with `hooksConsentResponse`, echoing the providerId;
        dismissing the dialog sends nothing and the request fires again on the
        next connect. One request per provider that needs an answer.
      type: object
      additionalProperties: false
      required: [type, providerId, headline, disclosure]
      properties:
        type:
          const: hooksConsentRequest
        providerId:
          type: string
          description: >-
            The hook provider whose install is being approved (HookProvider.id).
            The client never originates this value — it echoes it back in its
            `hooksConsentResponse`.
        headline:
          type: string
          description: One-sentence summary of what is being approved.
        disclosure:
          type: string
          description: |
            Full disclosure body (what is written, what data moves, how to undo),
            paragraphs separated by blank lines.

    AreaMappingsLoaded:
      description: |
        Workspace-folder-to-Area mappings. Folder names map to one or more Area
        labels; new agents from that folder prefer seats inside those Areas.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: areaMappingsLoaded
        mappings:
          type: object
          description: Map of folder name (string) to array of Area labels.
          additionalProperties:
            type: array
            items:
              type: string

    ExternalAssetDirectoriesUpdated:
      description: External asset directory list changed (after add/remove).
      type: object
      additionalProperties: false
      required: [type, dirs]
      properties:
        type:
          const: externalAssetDirectoriesUpdated
        dirs:
          type: array
          items:
            type: string

    WorkspaceFolders:
      description: Multi-root workspace folders (VS Code only).
      type: object
      additionalProperties: false
      required: [type, folders]
      properties:
        type:
          const: workspaceFolders
        folders:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFolder'

    AgentDiagnostics:
      description: Connection diagnostics for all agents (response to requestDiagnostics).
      type: object
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          const: agentDiagnostics
        agents:
          type: array
          description: Per-agent diagnostic info; shape opaque to the protocol.
          items:
            type: object

    # ── Cat office (orchestrator) server messages ─────────────────

    CatProfilesLoaded:
      description: |
        Every cat profile, plus per engine the model and effort values
        its installed CLI accepts (read from `claude --help`, not hardcoded).
        Sent on connect and after every profile change.
      type: object
      additionalProperties: false
      required: [type, cats, engineOptions]
      properties:
        type:
          const: catProfilesLoaded
        cats:
          type: array
          items:
            $ref: '#/components/schemas/CatProfile'
        engineOptions:
          type: array
          description: One entry per engine with an adapter. A full model name (claude-...) is also accepted.
          items:
            $ref: '#/components/schemas/EngineOptions'

    CatProfileSaved:
      description: One cat profile was created or changed.
      type: object
      additionalProperties: false
      required: [type, profile]
      properties:
        type:
          const: catProfileSaved
        profile:
          $ref: '#/components/schemas/CatProfile'

    CatProfileRejected:
      description: A cat change failed validation or the hierarchy rules. Sent to the requester only.
      type: object
      additionalProperties: false
      required: [type, error]
      properties:
        type:
          const: catProfileRejected
        id:
          type: string
        error:
          type: string

    CatHierarchy:
      description: |
        The cat tree. `bossId` is the one cat with no parent (absent when there
        are no cats); `children` maps a cat id to its direct reports in list
        order. Sent on connect and after every change.
      type: object
      additionalProperties: false
      required: [type, children]
      properties:
        type:
          const: catHierarchy
        bossId:
          type: string
        children:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    CatTurnStarted:
      description: A cat started one turn (one CLI process) of a task. `id` is the office character that shows it.
      type: object
      additionalProperties: false
      required: [type, catId, taskId, id]
      properties:
        type:
          const: catTurnStarted
        catId:
          type: string
        taskId:
          type: string
        id:
          type: integer

    CatTurnFinished:
      description: |
        A cat turn ended. `costUsd` is the cost of this turn alone. The token
        counts come from the turn's stream-json `result` usage.
      type: object
      additionalProperties: false
      required: [type, catId, taskId, id, ok]
      properties:
        type:
          const: catTurnFinished
        catId:
          type: string
        taskId:
          type: string
        id:
          type: integer
        ok:
          type: boolean
        costUsd:
          type: number
        inputTokens:
          type: integer
        cacheReadTokens:
          type: integer
        cacheCreationTokens:
          type: integer
        outputTokens:
          type: integer

    CatMessage:
      description: |
        One office message between cats (or the user), sent before delivery.
        `from`/`to` are cat ids, `user`, or `team` (a brief to all reports).
      type: object
      additionalProperties: false
      required: [type, taskId, from, to, kind, text]
      properties:
        type:
          const: catMessage
        taskId:
          type: string
        from:
          type: string
        to:
          type: string
        kind:
          $ref: '#/components/schemas/CatMessageKind'
        text:
          type: string

    FlowStateChanged:
      description: |
        The state of a team task changed. `rootCatId` leads the task and
        `catIds` are every cat of its team (the root and the cats below it):
        the office gathers them for the briefing meeting. The server always
        ends a task with a done, error, cancelled or interrupted state.
      type: object
      additionalProperties: false
      required: [type, taskId, state]
      properties:
        type:
          const: flowStateChanged
        taskId:
          type: string
        state:
          $ref: '#/components/schemas/FlowState'
        rootCatId:
          type: string
        catIds:
          type: array
          items:
            type: string

    CatCharacters:
      description: |
        The resident office character of every cat profile: one character per
        cat, alive while the profile exists. Sent on connect and on every
        change (profile created, saved or deleted, turn started or ended).
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: catCharacters
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CatCharacter'

    CatCharacter:
      type: object
      additionalProperties: false
      required: [catId, id, name, appearance, working]
      properties:
        catId:
          type: string
        id:
          type: integer
          description: Office agent id of the character.
        name:
          type: string
        appearance:
          $ref: '#/components/schemas/CatAppearance'
        working:
          type: boolean
          description: A turn of this cat runs now.
        lead:
          type: boolean
          description: |
            The team lead: the root of the cat tree (`parentId: null`). Absent
            for every other cat. The office seats it at the lead desk.

    # ── Cat CEO (docs/catavasia/cat-ceo-judge.md) ─────────────────

    CatCeoSettings:
      description: |
        The Cat CEO: the judge above the boss that reviews every finished team
        task and edits the cats' Rules and Lessons. Sent on connect and after
        every change. `systemPrompt` is the Role & conduct of `prompts/cat-ceo.md`.
      type: object
      additionalProperties: false
      required:
        [
          type,
          enabled,
          name,
          appearance,
          model,
          effort,
          maxEditsPerCatPerDay,
          tidyUserItems,
          systemPrompt,
        ]
      properties:
        type:
          const: catCeoSettings
        enabled:
          type: boolean
        name:
          type: string
        appearance:
          $ref: '#/components/schemas/CatAppearance'
        model:
          type: string
        effort:
          type: string
        maxEditsPerCatPerDay:
          type: integer
        tidyUserItems:
          type: boolean
          description: A tidy may rewrite and merge the items the user wrote (default false). It never removes them.
        systemPrompt:
          type: string

    ReviewStarted:
      description: The Cat CEO started the review of a finished team task.
      type: object
      additionalProperties: false
      required: [type, taskId, reviewId]
      properties:
        type:
          const: reviewStarted
        taskId:
          type: string
        reviewId:
          type: string

    ReviewFinished:
      description: |
        The Cat CEO review of a task: verdict, one score per assignment (the
        root's own work has assignmentId `root`), the committed prompt edits
        and the edits the server refused.
      type: object
      additionalProperties: false
      required: [type, taskId, reviewId, verdict, summary, scores, edits, rejectedEdits]
      properties:
        type:
          const: reviewFinished
        taskId:
          type: string
        reviewId:
          type: string
        verdict:
          $ref: '#/components/schemas/ReviewVerdict'
        summary:
          type: string
        costUsd:
          type: number
        scores:
          type: array
          items:
            $ref: '#/components/schemas/ReviewScore'
        edits:
          type: array
          items:
            $ref: '#/components/schemas/ReviewEdit'
        rejectedEdits:
          type: array
          items:
            $ref: '#/components/schemas/RejectedEdit'

    ReviewFailed:
      description: The Cat CEO review of a task failed (no score, no edit).
      type: object
      additionalProperties: false
      required: [type, taskId, reviewId, error]
      properties:
        type:
          const: reviewFailed
        taskId:
          type: string
        reviewId:
          type: string
        error:
          type: string

    PromptHistory:
      description: The commits of one cat's prompt file, newest first (answer to getPromptHistory).
      type: object
      additionalProperties: false
      required: [type, catId, entries]
      properties:
        type:
          const: promptHistory
        catId:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PromptHistoryEntry'
        lastTidy:
          $ref: '#/components/schemas/PromptTidyInfo'

    PromptTidy:
      description: |
        A tidy of one cat's Rules and Lessons by the Cat CEO changed state.
        `done` with `sha`: the tidy commit. `skipped`: nothing to do (no
        change since the last tidy, limit, or too few items).
      type: object
      additionalProperties: false
      required: [type, catId, state, text]
      properties:
        type:
          const: promptTidy
        catId:
          type: string
        state:
          $ref: '#/components/schemas/TidyState'
        text:
          type: string
        sha:
          type: string
        changed:
          type: integer
          description: Items merged, rewritten or removed by the tidy commit.
        costUsd:
          type: number

    PromptTidyInfo:
      description: The newest tidy of a cat, with the changes it marked but did not apply.
      type: object
      additionalProperties: false
      required: [at, trigger, summary, rows]
      properties:
        at:
          type: integer
        trigger:
          $ref: '#/components/schemas/TidyTrigger'
        summary:
          type: string
        sha:
          type: string
        costUsd:
          type: number
        rows:
          type: array
          items:
            $ref: '#/components/schemas/TidyRow'

    TidyState:
      type: string
      enum: [queued, done, skipped, failed]

    TidyTrigger:
      type: string
      enum: [cap, reviews, manual, sweep]

    TidyOp:
      type: string
      enum: [merge, rewrite, remove]

    TidyRow:
      description: One change of a tidy. `applied` false = marked for the user only (an item the user wrote).
      type: object
      additionalProperties: false
      required: [op, applied, section, before, reason]
      properties:
        op:
          $ref: '#/components/schemas/TidyOp'
        applied:
          type: boolean
        section:
          $ref: '#/components/schemas/PromptSection'
        before:
          type: array
          items:
            $ref: '#/components/schemas/PromptItem'
        after:
          $ref: '#/components/schemas/PromptItem'
        reason:
          type: string

    PromptDiff:
      description: The unified diff of one commit of a cat's prompt file (answer to getPromptDiff).
      type: object
      additionalProperties: false
      required: [type, catId, sha, diff]
      properties:
        type:
          const: promptDiff
        catId:
          type: string
        sha:
          type: string
        diff:
          type: string

    QueueChanged:
      description: |
        Turn scheduler state: cats running a turn now, cats waiting for a free
        slot (FIFO order), and the cap.
      type: object
      additionalProperties: false
      required: [type, running, queued, cap]
      properties:
        type:
          const: queueChanged
        running:
          type: array
          items:
            type: string
        queued:
          type: array
          items:
            type: string
        cap:
          type: integer

    NarratorLine:
      description: Russian status line of one cat (narrator template output), sent on change only.
      type: object
      additionalProperties: false
      required: [type, catId, state, line]
      properties:
        type:
          const: narratorLine
        catId:
          type: integer
          description: Office agent id of the cat.
        state:
          $ref: '#/components/schemas/NarratorState'
        line:
          type: string
          description: Russian, at most 60 characters.

    NarratorSummary:
      description: Haiku summary of one conversation, validated by the server.
      type: object
      additionalProperties: false
      required: [type, conversationId, catIds, summary]
      properties:
        type:
          const: narratorSummary
        conversationId:
          type: string
        catIds:
          type: array
          items:
            type: integer
        summary:
          type: string
          description: Russian, at most 120 characters.

    NarratorSettings:
      description: Narrator settings (standalone), sent on connect and after a change.
      type: object
      additionalProperties: false
      required: [type, aiSummaries, rawToolStatus]
      properties:
        type:
          const: narratorSettings
        aiSummaries:
          type: boolean
        rawToolStatus:
          type: boolean

    # ── Client message variants ────────────────────────────────────

    WebviewReady:
      description: Client signals it's ready to receive state.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: webviewReady

    LaunchAgent:
      description: Launch a new Claude agent in a new terminal.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: launchAgent
        folderPath:
          type: string
          description: Workspace folder path (for multi-root workspaces).
        bypassPermissions:
          type: boolean

    FocusAgent:
      description: Focus an agent's terminal.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: focusAgent
        id:
          type: integer

    CloseAgent:
      description: Close (dismiss) an agent.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: closeAgent
        id:
          type: integer

    SaveAgentSeats:
      description: Persist seat assignments for current agents.
      type: object
      additionalProperties: false
      required: [type, seats]
      properties:
        type:
          const: saveAgentSeats
        seats:
          type: object
          description: Map of agent ID (string) to seat assignment.
          additionalProperties:
            $ref: '#/components/schemas/SeatAssignment'

    SaveLayout:
      description: Save the office layout to ~/.pixel-agents/layout.json.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: saveLayout
        layout:
          type: object
          description: Opaque layout object; format owned by the rendering layer.

    SavePetCare:
      description: Save the pet-care snapshot to ~/.pixel-agents/pets-state.json.
      type: object
      additionalProperties: false
      required: [type, state]
      properties:
        type:
          const: savePetCare
        state:
          type: object
          description: Opaque pet-care snapshot; format owned by the webview pet-care module.

    SetSoundEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setSoundEnabled
        enabled:
          type: boolean

    SetLastSeenVersion:
      type: object
      additionalProperties: false
      required: [type, version]
      properties:
        type:
          const: setLastSeenVersion
        version:
          type: string

    SetAlwaysShowLabels:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAlwaysShowLabels
        enabled:
          type: boolean

    SetGhostHeadlessAgents:
      description: >-
        Toggle translucent rendering for headless agents (adopted sessions with no
        terminal to focus).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setGhostHeadlessAgents
        enabled:
          type: boolean

    SetHooksEnabled:
      type: object
      additionalProperties: false
      required: [type, providerId, enabled]
      properties:
        type:
          const: setHooksEnabled
        providerId:
          type: string
          description: >-
            The hook provider being toggled (HookProvider.id). The client
            echoes the id of the hooksStatus row the checkbox renders; it
            never originates one.
        enabled:
          type: boolean

    HooksConsentResponse:
      description: |
        The user's answer to `hooksConsentRequest` — an ABSOLUTE statement of
        the state the user wants, revisable from the Intro's closing step. Only
        an exact `install` grants consent and installs; only an exact `never`
        records a durable decline and persists hooks-off (uninstalling first
        when this provider's hooks are on disk from an earlier answer).
        `notNow` writes nothing on a fresh ask, but over anything an EARLIER
        answer left behind it reverts it — uninstalling a landed install,
        clearing a recorded grant or decline — so the ask genuinely returns on
        the next connect. Any unrecognized value writes NOTHING and the user is
        asked again — a malformed choice must never be read as approval, a
        durable decline, or an uninstall trigger. The server ignores this
        message on unprivileged standalone connections, which were never sent
        the request.
      type: object
      additionalProperties: false
      required: [type, providerId, choice]
      properties:
        type:
          const: hooksConsentResponse
        providerId:
          type: string
          description: >-
            The provider this answer is about, echoed verbatim from the
            `hooksConsentRequest` that solicited it. An id naming no
            registered provider is treated exactly like a junk choice:
            write nothing.
        choice:
          $ref: '#/components/schemas/HooksConsentChoice'

    HooksConsentChoice:
      description: >-
        The three consent outcomes. Receivers must treat any other value as a
        no-op: write nothing, ask again. (An exact notNow itself is a no-op
        only on a fresh ask — over an earlier answer it is a revision that
        undoes what that answer left behind.)
      type: string
      enum: [install, notNow, never]

    SetHooksInfoShown:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setHooksInfoShown

    SetWatchAllSessions:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setWatchAllSessions
        enabled:
          type: boolean

    ExportLayout:
      description: Trigger layout export via host-native save dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: exportLayout

    ResetLayoutToDefault:
      description: |
        Replace the saved layout with the bundled default office. The host
        writes it to layout.json and answers with layoutLoaded.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: resetLayoutToDefault

    ResetAllToDefault:
      description: |
        Start from scratch. The host first copies cats.json, layout.json,
        pets-state.json, tasks.json and the prompts/ folder to
        ~/.pixel-agents/backups/<timestamp>/. Then the layout goes back to the
        bundled default and the pet-care state is cleared. A host with a cat
        office also puts back the default cat team (hierarchy and prompt files,
        one prompt commit `user(all): reset to defaults`). The office part needs
        the server token, and the host refuses the whole reset while a task or
        review runs. Settings, agents and the task history are kept. Answered
        with resetAllResult; on success also layoutLoaded and petCareLoaded.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: resetAllToDefault

    ImportLayout:
      description: Trigger layout import via host-native open dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: importLayout

    OpenSessionsFolder:
      description: Open ~/.claude/projects in the OS file manager.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: openSessionsFolder

    AddExternalAssetDirectory:
      description: >-
        Add an external asset directory. In VS Code the host shows a native
        directory picker and omits `path`; the standalone browser has no native
        picker, so it supplies an absolute `path` typed by the user.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: addExternalAssetDirectory
        path:
          type: string
          description: Absolute directory path (standalone browser only; omitted in VS Code).

    RemoveExternalAssetDirectory:
      description: Remove an external asset directory by path.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeExternalAssetDirectory
        path:
          type: string

    SaveAreaMappings:
      description: Persist folder-to-Area mappings for seat assignment.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: saveAreaMappings
        mappings:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    SetShowAreas:
      description: Toggle the Areas overlay (translucent rendering on top of the office).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowAreas
        enabled:
          type: boolean

    RequestDiagnostics:
      description: Request agent connection diagnostics (server responds with agentDiagnostics).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDiagnostics

    SaveCatProfile:
      description: Create or replace one cat profile (needs the server token). The server validates it.
      type: object
      additionalProperties: false
      required: [type, profile]
      properties:
        type:
          const: saveCatProfile
        profile:
          $ref: '#/components/schemas/CatProfile'

    DeleteCatProfile:
      description: Delete one cat (needs the server token). Its reports move to its parent; a deleted boss hands over to its first report.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: deleteCatProfile
        id:
          type: string

    SetCatParent:
      description: Make cat `id` report to `parentId` (needs the server token). Refused on a cycle or an unknown cat.
      type: object
      additionalProperties: false
      required: [type, id, parentId]
      properties:
        type:
          const: setCatParent
        id:
          type: string
        parentId:
          type: string

    PromoteCatToBoss:
      description: Cat `id` becomes the boss; the old boss reports to it (needs the server token).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: promoteCatToBoss
        id:
          type: string

    SetTurnConcurrency:
      description: At most this many cat turns run at once (1-12). Others wait in a FIFO queue.
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          const: setTurnConcurrency
        value:
          type: integer

    SetCatCeoSettings:
      description: Change the Cat CEO (needs the server token). Absent fields keep their value.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setCatCeoSettings
        enabled:
          type: boolean
        name:
          type: string
        appearance:
          $ref: '#/components/schemas/CatAppearance'
        model:
          type: string
        effort:
          type: string
        maxEditsPerCatPerDay:
          type: integer
        tidyUserItems:
          type: boolean
          description: A tidy may rewrite and merge the items the user wrote (default false). It never removes them.
        systemPrompt:
          type: string

    GetPromptHistory:
      description: "Ask for the commits of a cat's prompt file (needs the server token). Answer: promptHistory."
      type: object
      additionalProperties: false
      required: [type, catId]
      properties:
        type:
          const: getPromptHistory
        catId:
          type: string

    GetPromptDiff:
      description: 'Ask for the diff of one prompt commit (needs the server token). Answer: promptDiff.'
      type: object
      additionalProperties: false
      required: [type, catId, sha]
      properties:
        type:
          const: getPromptDiff
        catId:
          type: string
        sha:
          type: string

    RevertPromptEdit:
      description: Revert one commit of a cat's prompt file (needs the server token). Commits `user(<cat>) revert <sha>`.
      type: object
      additionalProperties: false
      required: [type, catId, sha]
      properties:
        type:
          const: revertPromptEdit
        catId:
          type: string
        sha:
          type: string

    RestorePromptVersion:
      description: Make the prompt file of a cat the version of commit `sha` (needs the server token).
      type: object
      additionalProperties: false
      required: [type, catId, sha]
      properties:
        type:
          const: restorePromptVersion
        catId:
          type: string
        sha:
          type: string

    TidyPrompt:
      description: "Tidy now: the Cat CEO reviews one cat's Rules and Lessons (needs the server token). Answer: promptTidy."
      type: object
      additionalProperties: false
      required: [type, catId]
      properties:
        type:
          const: tidyPrompt
        catId:
          type: string

    CheckEngines:
      description: |
        Probe every engine CLI again now (installed, version, logged in), for
        "Check again" after an install or a login. Every client then gets
        catProfilesLoaded with the new `engineOptions[].status`.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: checkEngines

    RemovePromptItem:
      description: Remove one Rules or Lessons item (`R3`, `L2`) of a cat's prompt file (needs the server token).
      type: object
      additionalProperties: false
      required: [type, catId, itemId]
      properties:
        type:
          const: removePromptItem
        catId:
          type: string
        itemId:
          type: string

    SavePromptItem:
      description: |
        Add (no itemId) or change one Rules or Lessons item of a cat's prompt
        file (needs the server token). One line, at most 280 characters.
      type: object
      additionalProperties: false
      required: [type, catId, section, text]
      properties:
        type:
          const: savePromptItem
        catId:
          type: string
        section:
          $ref: '#/components/schemas/PromptSection'
        itemId:
          type: string
        text:
          type: string

    SetShowGuests:
      description: Show external Claude sessions (guests) as translucent characters outside the hierarchy.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowGuests
        enabled:
          type: boolean

    SetNarratorSettings:
      description: Change narrator settings (standalone). Absent fields keep their value.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setNarratorSettings
        aiSummaries:
          type: boolean
        rawToolStatus:
          type: boolean

    # ── Supporting schemas ─────────────────────────────────────────

    ReviewVerdict:
      type: string
      enum: [pass, concerns, fail]

    PromptAuthor:
      type: string
      enum: [cat-ceo, user, guard]

    PromptFlag:
      type: string
      enum: [reverted, watch, manual review]

    PromptSection:
      type: string
      enum: [Rules, Lessons]

    ReviewScore:
      type: object
      additionalProperties: false
      required: [catId, assignmentId, score, bubble]
      properties:
        catId:
          type: string
        assignmentId:
          type: string
          description: "`root` for the lead's own work."
        score:
          type: integer
        bubble:
          type: string
          description: At most 40 characters, shown over the cat.
        anomalies:
          type: array
          description: Anomalies of this cat, as `kind (severity) evidence` (hover text).
          items:
            type: string

    ReviewEdit:
      type: object
      additionalProperties: false
      required: [catId, sha, subject]
      properties:
        catId:
          type: string
        sha:
          type: string
        subject:
          type: string
        items:
          type: array
          description: New or changed item ids (`R4`, `L7`).
          items:
            type: string

    RejectedEdit:
      type: object
      additionalProperties: false
      required: [catId, reason]
      properties:
        catId:
          type: string
        reason:
          type: string

    PromptHistoryEntry:
      type: object
      additionalProperties: false
      required: [sha, at, author, subject]
      properties:
        sha:
          type: string
        at:
          type: integer
          description: Epoch ms of the commit.
        author:
          $ref: '#/components/schemas/PromptAuthor'
        subject:
          type: string
        taskId:
          type: string
        flag:
          $ref: '#/components/schemas/PromptFlag'
        scoreBefore:
          type: number
          description: Mean score of the cat with the version before this commit.
        scoreAfter:
          type: number
          description: Mean score of the cat with this version.
        tidy:
          type: array
          description: The per-item changes of a Cat CEO tidy commit.
          items:
            $ref: '#/components/schemas/TidyRow'

    CatProfile:
      description: |
        One cat of the office: who it is, how it looks, which engine, model and
        effort it runs, and its place in the tree (`parentId` null = the boss;
        exactly one cat is the boss).
      type: object
      additionalProperties: false
      required: [id, name, appearance, role, systemPrompt, engine, model, effort, parentId]
      properties:
        id:
          type: string
          description: Stable id, `^[a-z0-9][a-z0-9-]{0,31}$`.
        name:
          type: string
        appearance:
          $ref: '#/components/schemas/CatAppearance'
        role:
          type: string
        systemPrompt:
          type: string
          description: |
            The `Role & conduct` section of the cat's prompt file
            (`~/.pixel-agents/prompts/<id>.md`). Editing it commits a new
            version of that file. The whole file is appended to the engine's
            default system prompt.
        rules:
          type: array
          description: Read-only. `Rules` items of the prompt file (the Cat CEO edits them).
          items:
            $ref: '#/components/schemas/PromptItem'
        lessons:
          type: array
          description: Read-only. `Lessons` items of the prompt file (the Cat CEO edits them).
          items:
            $ref: '#/components/schemas/PromptItem'
        promptError:
          type: string
          description: Read-only. The prompt file on disk does not parse; the last committed version is used.
        engine:
          $ref: '#/components/schemas/CatEngine'
        model:
          type: string
        effort:
          type: string
        parentId:
          oneOf:
            - type: string
            - type: 'null'
        isDefault:
          type: boolean
          description: Seeded by the app, not by the user.

    PromptItem:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
          description: '`R1`, `L3`, ... Never reused inside one file.'
        text:
          type: string

    EngineOptions:
      type: object
      additionalProperties: false
      required: [engine, models, efforts]
      properties:
        engine:
          $ref: '#/components/schemas/CatEngine'
        models:
          type: array
          items:
            type: string
        efforts:
          type: array
          items:
            type: string
        unavailable:
          description: Why cats of this engine cannot run on this server (e.g. "Codex CLI not found").
          type: string
        status:
          $ref: '#/components/schemas/EngineStatus'

    EngineStatus:
      description: |
        The engine CLI as the last probe saw it (`claude --version` +
        `claude auth status`, `codex --version` + `codex login status`).
        No `loggedIn` = the probe could not tell. Absent before the first probe.
      type: object
      additionalProperties: false
      required: [installed]
      properties:
        installed:
          type: boolean
        version:
          type: string
        loggedIn:
          type: boolean
        detail:
          description: Short human text ("not logged in", "logged in (claude.ai)").
          type: string
        apiKey:
          description: |
            True: the engine signs in with an API key (pay per use), and the UI
            shows money. False: a subscription login (claude.ai, ChatGPT), and the
            UI hides every cost. Absent: unknown, and the UI hides costs too.
          type: boolean

    CatAppearance:
      description: |
        A breed preset (`breed` = lower-case breed name, e.g. `marmalade`) and
        optional overrides: coat `pattern`, colour layers, eyes, collar
        (`#rrggbb`, or `none` for no collar). A missing layer keeps the colour
        of the base breed.
      type: object
      additionalProperties: false
      properties:
        breed:
          type: string
        colors:
          $ref: '#/components/schemas/CatColorLayers'
        pattern:
          $ref: '#/components/schemas/CatPattern'
        eyes:
          type: string
        collar:
          type: string

    CatColorLayers:
      type: object
      additionalProperties: false
      properties:
        fur:
          type: string
        belly:
          type: string
        stripe:
          type: string
        patchA:
          type: string
        patchB:
          type: string
        point:
          type: string

    CatEngine:
      type: string
      enum: [claude, codex]

    CatPattern:
      type: string
      enum: [solid, tabby, tuxedo, calico, tortie, siamese, bengal, sweater]

    NarratorState:
      type: string
      enum: [thinking, reading, editing, testing, waiting, done, error]

    CatMessageKind:
      type: string
      enum: [task, brief, delegate, ask, reply, report, final, nudge]

    FlowState:
      type: string
      enum: [briefing, delegating, working, reporting, merging, done, error, cancelled, interrupted]

    AgentSeatMeta:
      description: |
        Seat metadata associated with an agent (palette index, hue shift, seat ID).
        Used in `existingAgents.agentMeta`. All fields optional because some agents
        may not have a seat assignment yet.
      type: object
      additionalProperties: false
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: string

    SeatAssignment:
      description: |
        Required seat assignment payload sent in `saveAgentSeats`. `seatId` may be
        null when the agent is unseated (left their chair). All other fields required.
      type: object
      additionalProperties: false
      required: [palette, hueShift, seatId]
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: [string, 'null']

    WorkspaceFolder:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string

    CharacterSpriteSet:
      description: |
        One palette's character sprites as 3D hex-string arrays (frames × rows × pixels).
        Three direction sets per palette: down, up, right (left is rendered as flipped right).
      type: object
      additionalProperties: false
      required: [down, up, right]
      properties:
        down:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        up:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        right:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FurnitureAssetMessage:
      description: One entry in the furniture catalog (sent in `furnitureAssetsLoaded`).
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - label
        - category
        - file
        - width
        - height
        - footprintW
        - footprintH
        - isDesk
        - canPlaceOnWalls
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        category:
          type: string
        file:
          type: string
        width:
          type: integer
        height:
          type: integer
        footprintW:
          type: integer
        footprintH:
          type: integer
        isDesk:
          type: boolean
        canPlaceOnWalls:
          type: boolean
        groupId:
          type: string
        canPlaceOnSurfaces:
          type: boolean
        backgroundTiles:
          type: integer
        orientation:
          type: string
        state:
          type: string
        mirrorSide:
          type: boolean
        rotationScheme:
          type: string
        animationGroup:
          type: string
        frame:
          type: integer
