name: "Feedback"
description: "Tell us how Catavasia feels to use: what you like and what to make better."
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Short feedback is fine. One sentence helps too.
        For a bug, use the Bug report form. For a new idea, use the Feature request form.

  - type: textarea
    id: impressions
    attributes:
      label: "General impressions"
      description: "How was the install? How does the office feel after a day of use?"
    validations:
      required: true

  - type: textarea
    id: liked
    attributes:
      label: "What do you like?"
      description: "Things we must keep."

  - type: textarea
    id: improve
    attributes:
      label: "What should we make better?"
      description: "Things that confuse you, annoy you or take too many clicks."

  - type: dropdown
    id: usage
    attributes:
      label: "How do you use Catavasia?"
      options:
        - "To watch my own Claude Code sessions"
        - "To give tasks to the cat team"
        - "Both"
        - "I only tried it"

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots"
      description: "Optional. Remove tokens, user names and private paths first."
