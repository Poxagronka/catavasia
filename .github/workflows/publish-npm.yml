# Publishes the catavasia package to npm after each merge to main.
# Every merge bumps the package.json version, so a version that is not on npm
# yet is a new release. Auth uses npm trusted publishing (OIDC): no token.
# The npm trusted publisher config must name this exact file: publish-npm.yml.

name: Publish npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  check:
    name: Check npm Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Whether the Version Is on npm
        id: check
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if output="$(npm view "$name@$version" version 2>&1)"; then
            echo "$name@$version is already on npm. Nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q E404 <<< "$output"; then
            echo "$name@$version is not on npm. Publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$output"
            echo "::error::npm view failed for a reason other than E404."
            exit 1
          fi

  publish:
    name: Verify and Publish
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm >=11.5.1 and Node >=22.14.0.
      - name: Install Trusted-Publishing npm CLI
        run: npm install --global "npm@^11.15.0"

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run check-types

      - name: Format Check
        run: npm run format:check

      - name: Build and Verify npm Artifact
        id: npm-package
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/npm-package"
          npm run verify:npm-package -- --output-dir "$output_dir"
          tarball="$(node -p "require('$output_dir/package-metadata.json').tarballPath")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Package Contract Tests
        run: npm run test:package-contract

      - name: Webview Tests
        run: npm test -w webview-ui

      - name: Server Tests
        run: npm test -w server -- --testTimeout=60000

      # Prerelease versions (1.4.1-cats.N) need an explicit --tag latest.
      # Provenance is automatic with trusted publishing from a public repo.
      - name: Publish to npm
        env:
          TARBALL: ${{ steps.npm-package.outputs.tarball }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          npm publish "$TARBALL" --tag latest --access public
          echo "Published catavasia@$VERSION" >> "$GITHUB_STEP_SUMMARY"
